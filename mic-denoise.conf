# Laptop microphone like a headset microphone, published as a separate PipeWire source.
#
#   mic -> echo cancellation (webrtc; reference: the monitor of the default output)
#       -> high-pass 100 Hz -> RNNoise -> "Microphone (denoised)"
#
# Two client-side modules hosted by PipeWire's stock filter-chain.service
# (pipewire -c filter-chain.conf), which merges ~/.config/pipewire/filter-chain.conf.d/.
# A separate client: it can be switched on and off without restarting PipeWire, and a
# broken graph breaks only this service.
#
# install.sh replaces @MIC_SOURCE@ with this machine's ALSA capture node and @NAME@ with the
# source name in the session language (English, or Russian under a ru locale).
# The echo-cancel module stays first: uninstall.sh and check.sh read the microphone name
# from the first target.object below.

context.modules = [
  # 1. Echo cancellation. First in the chain on purpose: the canceller wants the raw,
  #    linear microphone signal, and RNNoise after it is non-linear. monitor.mode takes
  #    the reference from the monitor of whatever output is the default, so every app's
  #    playback is covered without routing anything through a virtual sink.
  { name = libpipewire-module-echo-cancel
    flags = [ nofail ]
    args = {
      library.name   = aec/libspa-aec-webrtc
      monitor.mode   = true
      # Both capsules carry the same voice; mono here is what a headset microphone gives.
      audio.channels = 1
      audio.position = [ MONO ]
      # RNNoise does the noise suppression; webrtc's own would process the signal twice.
      aec.args = { webrtc.noise_suppression = false webrtc.gain_control = false webrtc.voice_detection = false }
      capture.props = {
        node.name          = "mic_aec_capture"
        # Only runs while something records from the denoised source.
        node.passive       = true
        target.object      = "@MIC_SOURCE@"
        # Omarchy's "set default input" moves every capture stream to the new default,
        # which would drag this one onto the chain's own output and make a loop. Pin it,
        # and wait for the named microphone instead of falling back to whatever exists.
        node.dont-move     = true
        node.dont-fallback = true
        node.linger        = true
      }
      source.props = {
        node.name        = "mic_aec"
        # Shows up as a second input in audio panels. media.class = Audio/Source/Virtual
        # would hide it from Omarchy's panel, but segfaults the host on PipeWire 1.6.8.
        node.description = "Microphone (echo cancelled, no RNNoise)"
      }
      # In monitor.mode the "sink" stream is the one that captures the output's monitor.
      sink.props = {
        node.name    = "mic_aec_reference"
        node.passive = true
      }
    }
  }

  # 2. High-pass and RNNoise.
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "@NAME@"
      media.name       = "@NAME@"
      filter.graph = {
        nodes = [
          # Fan and room rumble sit below the voice. Tune "Freq" if your voice is deep.
          { type = builtin name = hp label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          # RNNoise (noise-suppression-for-voice). "VAD Threshold (%)": higher gates
          # non-speech harder but can clip the first syllable; 50 is the plugin's default.
          { type = ladspa name = rnnoise plugin = librnnoise_ladspa label = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50.0 } }
        ]
        links   = [ { output = "hp:Out" input = "rnnoise:Input" } ]
        inputs  = [ "hp:In" ]
        outputs = [ "rnnoise:Output" ]
      }
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name          = "mic_denoise_capture"
        node.passive       = true
        target.object      = "mic_aec"
        node.dont-move     = true
        node.dont-fallback = true
        node.linger        = true
      }
      playback.props = {
        node.name   = "mic_denoise"
        media.class = Audio/Source
      }
    }
  }
]
