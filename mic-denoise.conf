# Laptop microphone with noise suppression, published as a separate PipeWire source.
#
#   mic (stereo DMIC) -> mix to mono -> high-pass 100 Hz -> RNNoise -> "Microphone (denoised)"
#
# Hosted by PipeWire's stock filter-chain.service (pipewire -c filter-chain.conf), which
# merges ~/.config/pipewire/filter-chain.conf.d/. A separate client: it can be switched on
# and off without restarting PipeWire, and a broken graph breaks only this service.
#
# @MIC_SOURCE@ is replaced by install.sh with this machine's ALSA capture node.

context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Microphone (denoised)"
      media.name       = "Microphone (denoised)"

      filter.graph = {
        nodes = [
          # Both capsules carry the same voice; averaging them lowers uncorrelated noise
          # and gives the mono signal a headset microphone gives.
          { type = builtin name = mix label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
          # Fan and room rumble sit below the voice. Tune "Freq" if your voice is deep.
          { type = builtin name = hp  label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          # RNNoise (noise-suppression-for-voice). "VAD Threshold (%)": higher gates
          # non-speech harder but can clip the first syllable; 50 is the plugin's default.
          { type = ladspa name = rnnoise plugin = librnnoise_ladspa label = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50.0 } }
        ]
        links = [
          { output = "mix:Out" input = "hp:In" }
          { output = "hp:Out"  input = "rnnoise:Input" }
        ]
        inputs  = [ "mix:In 1" "mix:In 2" ]
        outputs = [ "rnnoise:Output" ]
      }

      capture.props = {
        node.name      = "mic_denoise_capture"
        # Only runs while something records from the denoised source.
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
        target.object  = "@MIC_SOURCE@"
        # Omarchy's "set default input" moves every capture stream to the new default,
        # which would drag this one onto its own output and make a loop. Pin it, and wait
        # for the named microphone instead of falling back to whatever default exists.
        node.dont-move     = true
        node.dont-fallback = true
        node.linger        = true
      }
      playback.props = {
        node.name      = "mic_denoise"
        media.class    = Audio/Source
        audio.channels = 1
        audio.position = [ MONO ]
      }
    }
  }
]
